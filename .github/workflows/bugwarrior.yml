---
name: bugwarrior

on: [push, pull_request]

jobs:
  taskwarrior-build:
    runs-on: ubuntu-latest
    # We're currently seeing these complete in 5 minutes.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        taskwarrior-version: &taskwarrior_versions [2.6.2, 3.5.0]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Identify runner image
        id: runner-image
        run: echo "os=${ImageOS}" >> "${GITHUB_OUTPUT}"
      - name: Restore cached Taskwarrior ${{ matrix.taskwarrior-version }}
        id: taskwarrior-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/taskwarrior-${{ matrix.taskwarrior-version }}.tar.gz
          key: taskwarrior-${{ steps.runner-image.outputs.os }}-${{ runner.arch }}-${{ matrix.taskwarrior-version }}-${{ hashFiles('.github/scripts/build-taskwarrior.sh') }}
      - name: Build Taskwarrior ${{ matrix.taskwarrior-version }}
        if: steps.taskwarrior-cache.outputs.cache-hit != 'true'
        run: bash .github/scripts/build-taskwarrior.sh "${{ matrix.taskwarrior-version }}"
      - name: Upload Taskwarrior ${{ matrix.taskwarrior-version }}
        uses: actions/upload-artifact@v7
        with:
          name: taskwarrior-${{ matrix.taskwarrior-version }}
          path: ${{ runner.temp }}/taskwarrior-${{ matrix.taskwarrior-version }}.tar.gz
  bugwarrior-test:
    needs: taskwarrior-build
    runs-on: ubuntu-latest
    # We're currently seeing these complete in 1 minute.
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: [3.11, 3.12, 3.13, 3.14]
        taskwarrior-version: *taskwarrior_versions
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Download Taskwarrior ${{ matrix.taskwarrior-version }}
        uses: actions/download-artifact@v8
        with:
          name: taskwarrior-${{ matrix.taskwarrior-version }}
          path: ${{ runner.temp }}/taskwarrior-artifact
      - name: Install Taskwarrior ${{ matrix.taskwarrior-version }}
        run: |
          sudo mkdir -p /opt/taskwarrior
          sudo tar -xzf \
            "${RUNNER_TEMP}/taskwarrior-artifact/taskwarrior-${{ matrix.taskwarrior-version }}.tar.gz" \
            -C /opt/taskwarrior
          echo "/opt/taskwarrior/bin" >> "${GITHUB_PATH}"
      - name: Verify Taskwarrior version
        run: task --version
      - name: Run tests
        run: |
          uv sync --all-extras --group test --python ${{ matrix.python-version }}
          uv run bugwarrior --version
          uv run pytest
  bugwarrior-development-pip-test:
    runs-on: ubuntu-latest
    # We're currently seeing these complete in 1 minute.
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
      - name: Run tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y taskwarrior
          task --version

          python3 -m venv .venv
          source .venv/bin/activate
          pip install --upgrade "pip>=26.1"
          pip config --site set install.uploaded-prior-to P3D
          pip install --upgrade setuptools

          pip install -e ".[all]"
          pip install --group test

          bugwarrior --version
          pytest
  # Cannot migrate to uv: astral-sh/setup-uv does not support ppc64le,
  # and uraimo/run-on-arch-action runs inside a Docker container.
  bugwarrior-multiarch-test:
    runs-on: ubuntu-latest
    # We're currently seeing these complete in 10-30 minutes.
    timeout-minutes: 60
    strategy:
      matrix:
        architecture: [ppc64le]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Run tests on given architecture
        uses: uraimo/run-on-arch-action@v3
        with:
          arch: ${{ matrix.architecture }}
          distro: ubuntu_latest
          githubToken: ${{ github.token }}
          env: |
            # https://github.com/PyO3/setuptools-rust/issues/236
            CARGO_NET_GIT_FETCH_WITH_CLI: "true"
          install: |
            apt-get update -qq
            apt-get install -qq -y \
              cargo git libffi-dev libjpeg-dev libssl-dev python3-dev python3-venv taskwarrior zlib1g-dev
            task --version
          run: |
            apt-get install -qq -y pkg-config libssl-dev

            mkdir .venv
            python3 -m venv .venv
            source .venv/bin/activate
            pip install --upgrade "pip>=26.1"
            pip config --site set install.uploaded-prior-to P3D
            pip install --upgrade setuptools

            pip install -e .[all]
            pip install --group test

            bugwarrior --version
            pytest

